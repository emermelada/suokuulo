# Labels copied from `python scripts/list_labels.py` output (BirdNET v2.4).
# Weights and expected activity per season: baseline.yaml. Disturbance groups
# (people, machinery, gunshot) set how the dashboard and alerts treat them.
# Disturbance labels must stay here, or BirdNET's species filter drops them.
species:
  - {id: golden_plover,  label: "Pluvialis apricaria_European Golden-Plover", kind: indicator}
  - {id: wood_sandpiper, label: "Tringa glareola_Wood Sandpiper",             kind: indicator}
  - {id: common_snipe,   label: "Gallinago gallinago_Common Snipe",           kind: indicator}
  - {id: curlew,         label: "Numenius arquata_Eurasian Curlew",           kind: indicator}
  - {id: whimbrel,       label: "Numenius phaeopus_Whimbrel",                 kind: indicator}
  - {id: meadow_pipit,   label: "Anthus pratensis_Meadow Pipit",              kind: indicator}
  - {id: yellow_wagtail, label: "Motacilla flava_Western Yellow Wagtail",     kind: indicator}
  - {id: common_crane,   label: "Grus grus_Common Crane",                     kind: indicator}
  - {id: engine,         label: "Engine_Engine",                              kind: disturbance, group: machinery}
  - {id: power_tools,    label: "Power tools_Power tools",                    kind: disturbance, group: machinery}
  - {id: gun,            label: "Gun_Gun",                                    kind: disturbance, group: gunshot}
  - {id: human_voice,    label: "Human vocal_Human vocal",                    kind: disturbance, group: people}
