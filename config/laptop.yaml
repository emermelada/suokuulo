# Laptop: demo.yaml (board settings + demo scoring) plus replay from test_clips/.
# Override with --input, --mic, --mock.
include: demo.yaml
source: file
input: test_clips
verbose: false
web_port: 8000

# --demo playlist, played in order at real-time pace: [file or folder, max windows (null = all)].
# Clips picked because each confirms on its own (see eval_results.md).
demo:
  - [test_clips/background, 15]                              # 30 s quiet wind (2 s hop)
  - [test_clips/golden_plover/XC1193791.wav, null]           # score 50 -> 80, double chirp
  - [test_clips/common_snipe/XC1191555.wav, null]            # -> 90
  - [test_clips/common_crane/XC1174838.wav, null]            # -> 100 (bonus capped at 50)
  - [test_clips/power_tools/ESC50-1-19898-A-41.wav, null]    # chainsaw, 15 s from one recording
  - [test_clips/power_tools/ESC50-1-19898-B-41.wav, null]
  - [test_clips/power_tools/ESC50-1-19898-C-41.wav, null]    # -> 85, alarm + siren
  - [test_clips/background, 15]                              # alarm clears after 20 s
